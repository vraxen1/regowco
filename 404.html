<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Lost in Space</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020208;
            --neon-blue: #00f0ff;
            --neon-glow: #0072ff;
            --neon-dark: #002b5c;
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, #0a0d25 0%, var(--bg-color) 70%),
                radial-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 0);
            background-size: 100% 100%, 40px 40px;
            color: var(--text-white);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 1rem;
            animation: pulse-glow 3s infinite alternate, flicker 4s infinite alternate;
        }

        .error-message {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 1.5rem;
        }

        .description {
            font-size: 1.1rem;
            color: #8fa0dd;
            max-width: 500px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.6;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            position: relative;
        }

        .btn-primary {
            color: var(--bg-color);
            background-color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 0px transparent;
        }

        .btn-primary:hover {
            color: var(--neon-blue);
            background-color: transparent;
            box-shadow: 0 0 25px var(--neon-blue), inset 0 0 10px rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .btn-secondary {
            color: var(--neon-blue);
            background-color: transparent;
            border: 2px solid var(--neon-blue);
            box-shadow: inset 0 0 0px transparent;
        }

        .btn-secondary:hover {
            color: var(--bg-color);
            background-color: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Neon Animations */
        @keyframes pulse-glow {
            0% {
                text-shadow: 
                    0 0 10px #fff,
                    0 0 20px #fff,
                    0 0 30px var(--neon-blue),
                    0 0 40px var(--neon-glow),
                    0 0 70px var(--neon-glow),
                    0 0 100px var(--neon-glow);
            }
            100% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 15px var(--neon-blue),
                    0 0 25px var(--neon-glow),
                    0 0 50px var(--neon-glow),
                    0 0 80px var(--neon-glow);
            }
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.7;
                text-shadow: 0 0 10px var(--neon-dark);
            }
        }

        /* Background grid overlay element */
        .grid-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background-image: 
                linear-gradient(to top, rgba(2,2,8,1) 10%, rgba(2,2,8,0) 100%),
                linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px),
                linear-gradient(0deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            z-index: 1;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="grid-floor"></div>

    <div class="container">
        <div class="error-code">404</div>
        <div class="error-message">Connection Lost</div>
        <p class="description">
            The page you are looking for has drifted out into deep space or never existed in this timeline.
        </p>
        <div class="btn-container">
            <a href="/" class="btn btn-primary">Return Home</a>
            <a href="#" onclick="window.history.back(); return false;" class="btn btn-secondary">Go Back</a>
        </div>
    </div>

</body>
</html>
