<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Matrix</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020208;
            --neon-blue: #00f0ff;
            --neon-glow: #0072ff;
            --neon-dark: #002b5c;
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Canvas Background */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.75;
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            background: rgba(2, 2, 8, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            position: relative;
            z-index: 2;
            max-width: 90%;
            box-shadow: 0 0 40px rgba(0, 114, 255, 0.15);
        }

        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 1rem;
            animation: pulse-glow 3s infinite alternate, flicker 4s infinite alternate;
        }

        .error-message {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 1.5rem;
        }

        .description {
            font-size: 1.1rem;
            color: #8fa0dd;
            max-width: 500px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.6;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .btn-primary {
            color: var(--bg-color);
            background-color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .btn-primary:hover {
            color: var(--neon-blue);
            background-color: transparent;
            box-shadow: 0 0 25px var(--neon-blue), inset 0 0 10px rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .btn-secondary {
            color: var(--neon-blue);
            background-color: transparent;
            border: 2px solid var(--neon-blue);
        }

        .btn-secondary:hover {
            color: var(--bg-color);
            background-color: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Neon Glow & Flicker Animations */
        @keyframes pulse-glow {
            0% {
                text-shadow: 
                    0 0 10px #fff,
                    0 0 20px #fff,
                    0 0 30px var(--neon-blue),
                    0 0 40px var(--neon-glow),
                    0 0 70px var(--neon-glow),
                    0 0 100px var(--neon-glow);
            }
            100% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 15px var(--neon-blue),
                    0 0 25px var(--neon-glow),
                    0 0 50px var(--neon-glow),
                    0 0 80px var(--neon-glow);
            }
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.7;
                text-shadow: 0 0 10px var(--neon-dark);
            }
        }
    </style>
</head>
<body>

    <!-- Canvas for Blue Matrix Rain -->
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="error-code">404</div>
        <div class="error-message">System Anomaly</div>
        <p class="description">
            The page you requested has dissolved into the digital void. Your reality path could not be resolved.
        </p>
        <div class="btn-container">
            <a href="/" class="btn btn-primary">Jack Out (Home)</a>
            <a href="#" onclick="window.history.back(); return false;" class="btn btn-secondary">Trace Back</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        // Handle canvas sizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Matrix Rain Setup
        // Using neon blue hex variations instead of green strings
        const matrixChars = "010101ABCDEFGHIJKLMNOPQRSTUVWXYZｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
        const alphabet = matrixChars.split("");

        const fontSize = 16;
        let columns = canvas.width / fontSize;

        // Track vertical drop position for each rain column
        let rainDrops = [];
        function initRainDrops() {
            columns = canvas.width / fontSize;
            rainDrops = [];
            for (let x = 0; x < columns; x++) {
                rainDrops[x] = Math.random() * -100; // Staggered start off-screen
            }
        }
        initRainDrops();
        window.addEventListener('resize', initRainDrops);

        // Color definitions for the rain layers
        const cyanBright = "#00f0ff";
        const blueMid = "#0072ff";

        function drawMatrix() {
            // Draw slightly opaque black overlay to create long glowing trail effect
            ctx.fillStyle = 'rgba(2, 2, 8, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                
                // Randomly alternate colors between electric cyan and neon blue
                ctx.fillStyle = Math.random() > 0.85 ? cyanBright : blueMid;

                // Render character
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                // Reset stream to top after hitting bottom boundary with randomized delay
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }

                // Increment downward movement velocity
                rainDrops[i]++;
            }
        }

        // Lock animation cycle loop at roughly 30 FPS for ideal visibility flow
        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
